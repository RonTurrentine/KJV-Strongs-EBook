<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="kjv-sha" content="KJV_SHA_PLACEHOLDER">
  <title>Search KJV — KJV Strong's Bible</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="BiblePencil.ico">
</head>
<body class="bible-text">

  <nav class="chapter-nav">
    <h1 class="book-chapter"><span class="update-cross" onclick="openUpdateModal()" title="Update available!">&#10010;</span>KJV Bible</h1>
    <div class="nav-buttons">
      <a href="index.html" class="btn home-btn" title="Home"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg></a>
      <a href="indexes/strongs-hebrew-index.html" class="btn">Hebrew</a>
      <a href="indexes/strongs-greek-index.html" class="btn">Greek</a>
      <a href="navigate.html" class="btn">Go To</a>
      <button class="btn" onclick="history.back()" title="Back">&#9664; Back</button>
      <button class="btn hamburger-btn" id="hamburger-btn" onclick="toggleSettingsMenu()" title="Settings">&#9776;</button>
    </div>
  </nav>

  <div class="settings-dropdown" id="settings-dropdown">
    <div class="settings-section">
      <p class="settings-section-label">DISPLAY</p>
      <div class="settings-row settings-font-row">
        <button class="btn settings-font-btn" id="font-decrease" onclick="decreaseFontSize()">a&#8595;</button>
        <span class="settings-row-label">Font size</span>
        <button class="btn settings-font-btn" id="font-increase" onclick="increaseFontSize()">A&#8593;</button>
      </div>
    </div>
    <div class="settings-divider"></div>
    <div class="settings-section">
      <div class="settings-row settings-row-clickable" id="sync-kindle-row" onclick="syncToKindle()">
        <span class="settings-row-icon">&#9889;</span>
        Sync to Kindle
      </div>
      <div class="settings-row settings-row-clickable" onclick="rebakeNotes()">
        <span class="settings-row-icon">&#128260;</span>
        Rebake Notes
      </div>
      <div class="settings-row settings-row-clickable" onclick="exportNotes()">
        <span class="settings-row-icon">&#128190;</span>
        Export Notes
      </div>
    </div>
    <div class="settings-divider"></div>
    <div class="settings-section">
      <div class="settings-row settings-row-clickable" onclick="window.open('help.html','_blank')">
        <span class="settings-row-icon">&#10067;</span>
        Help / Documentation
      </div>
      <div class="settings-row settings-row-clickable" onclick="window.open('about.html','_blank')">
        <span class="settings-row-icon">&#8505;</span>
        About
      </div>
    </div>
    <div class="settings-divider"></div>
    <div class="settings-section">
      <div class="settings-row settings-row-clickable settings-row-exit" onclick="window.close()">
        <span class="settings-row-icon">&#10005;</span>
        Exit
      </div>
    </div>
  </div>
  <div class="search-page-wrap">

    <h2 class="search-title">Search KJV Text</h2>

    <!-- ── Scope Panel ─────────────────────────────────────────── -->
    <fieldset class="scope-panel" id="scope-panel">
      <legend class="scope-legend">Search Scope</legend>
      <p class="scope-hint">Leave everything blank to search the whole Bible.</p>

      <!-- Specific Book -->
      <div class="scope-row" id="scope-row-book">
        <label class="scope-radio-label">Specific Book:
          <select class="scope-book-select" id="scope-book-select" onchange="onBookSelected()">
            <option value="">-- Whole Bible --</option>
          </select>
        </label>
      </div>

      <!-- Category checkboxes, with OT/NT "select all" masters -->
      <div class="scope-categories" id="scope-categories">
        <div class="scope-cat-column">
          <p class="scope-cat-heading">
            <label class="scope-check-label scope-master-label" title="All 39 Old Testament books">
              <input type="checkbox" id="cat-ot-master" onchange="onMasterChecked('ot')"> <strong>Old Testament</strong>
            </label>
          </p>
          <label class="scope-check-label" title="Genesis, Exodus, Leviticus, Numbers, Deuteronomy"><input type="checkbox" class="cat-check" value="torah" onchange="onCategoryChecked()"> Torah</label>
          <label class="scope-check-label" title="Joshua, Judges, Ruth, 1 Samuel, 2 Samuel, 1 Kings, 2 Kings, 1 Chronicles, 2 Chronicles, Ezra, Nehemiah, Esther"><input type="checkbox" class="cat-check" value="historical" onchange="onCategoryChecked()"> Historical</label>
          <label class="scope-check-label" title="Job, Psalms, Proverbs, Ecclesiastes, Song of Solomon"><input type="checkbox" class="cat-check" value="poetic" onchange="onCategoryChecked()"> Poetic/Wisdom</label>
          <label class="scope-check-label" title="Isaiah, Jeremiah, Lamentations, Ezekiel, Daniel, Hosea, Joel, Amos, Obadiah, Jonah, Micah, Nahum, Habakkuk, Zephaniah, Haggai, Zechariah, Malachi"><input type="checkbox" class="cat-check" value="prophetic" onchange="onCategoryChecked()"> Prophetic</label>
        </div>
        <div class="scope-cat-column">
          <p class="scope-cat-heading">
            <label class="scope-check-label scope-master-label" title="All 27 New Testament books">
              <input type="checkbox" id="cat-nt-master" onchange="onMasterChecked('nt')"> <strong>New Testament</strong>
            </label>
          </p>
          <label class="scope-check-label" title="Matthew, Mark, Luke, John"><input type="checkbox" class="cat-check" value="gospels" onchange="onCategoryChecked()"> Gospels</label>
          <label class="scope-check-label" title="Acts"><input type="checkbox" class="cat-check" value="acts" onchange="onCategoryChecked()"> Acts</label>
          <label class="scope-check-label" title="Romans, 1 Corinthians, 2 Corinthians, Galatians, Ephesians, Philippians, Colossians, 1 Thessalonians, 2 Thessalonians"><input type="checkbox" class="cat-check" value="paul_church" onchange="onCategoryChecked()"> Paul's Church Epistles</label>
          <label class="scope-check-label" title="1 Timothy, 2 Timothy, Titus, Philemon"><input type="checkbox" class="cat-check" value="paul_pastoral" onchange="onCategoryChecked()"> Paul's Pastoral Epistles</label>
          <label class="scope-check-label" title="Hebrews, James, 1 Peter, 2 Peter, 1 John, 2 John, 3 John, Jude"><input type="checkbox" class="cat-check" value="general" onchange="onCategoryChecked()"> General Epistles</label>
          <label class="scope-check-label" title="Revelation"><input type="checkbox" class="cat-check" value="revelation" onchange="onCategoryChecked()"> Revelation</label>
        </div>
      </div>
    </fieldset>

    <!-- ── Results per page + Search form ──────────────────────── -->
    <div class="search-controls-row">
      <label class="rpp-label">Results per page:
        <select class="rpp-select" id="rpp-select" onchange="onRppChanged()">
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="all">All</option>
        </select>
      </label>
    </div>

    <div class="search-form" id="search-form">
      <input type="text" class="search-input" id="search-input"
             placeholder="Enter word or phrase..." autocomplete="off">
      <button class="btn btn-primary" id="search-btn" onclick="doSearch()">Search</button>
    </div>

    <p class="search-warning">&#9888; Requires internet connection (Bible SuperSearch API)</p>

    <div id="search-status"></div>
    <div id="search-results"></div>
    <div id="search-pagination"></div>

  </div>

  <script src="js/fontsize.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/search.js"></script>

</body>
</html>
