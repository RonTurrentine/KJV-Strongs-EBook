name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Genesis 1 generator
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "& { .\generate_genesis1.ps1 }"

      - name: Verify generated sample pages
        shell: pwsh
        run: |
          $files = @('.\sample-chapter-gen1.html', '.\sample-verse-gen1.html')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
          }

          $expected = @{
            '.\sample-chapter-gen1.html' = @(
              'class="chapter-nav"',
              'class="btn"',
              'class="icon-btn"',
              'class="superscript-link"'
            )
            '.\sample-verse-gen1.html' = @(
              'id="verse-text"',
              'class="icon-btn"',
              'class="chapter-return-btn"'
            )
          }

          foreach ($file in $expected.Keys) {
            foreach ($needle in $expected[$file]) {
              if (-not (Select-String -Path $file -Pattern [regex]::Escape($needle) -SimpleMatch)) {
                throw "Missing expected markup [$needle] in $file"
              }
            }
          }

          if (Select-String -Path $files -Pattern 'class=""|href=""' -SimpleMatch) {
            throw 'Malformed doubled quotes found in generated HTML'
          }

          Write-Host 'Generated sample pages are present and contain expected UI markup.'
