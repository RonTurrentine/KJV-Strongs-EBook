  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="dict-page">

    <div class="dict-header">
      <h1 class="dict-strongs-id">G4275</h1>
      <div class="dict-nav">
        <a href="javascript:history.back()" class="btn">Back</a>
        <a href="../../indexes/strongs-greek-index.html" class="btn">Greek Index</a>
      </div>
    </div>

    <div class="dict-body">

      <p class="dict-original" lang="greek">προείδω</p>

      <table class="dict-table">
        <tbody>
          <tr><th>Transliteration</th><td>proeídō</td></tr>
          <tr><th>Phonetic</th><td>pro-i'-do</td></tr>

          <tr><th>Origin</th><td>from <a href="../../dict/greek/g4253.html" class="strongs-link">G4253</a> and <a href="../../dict/greek/g1492.html" class="strongs-link">G1492</a>;</td></tr>
        </tbody>
      </table>

      <div class="dict-def">
        <p class="dict-label">Definition</p>
        <p>foresee</p>
      </div>

<div class="dict-kjv"><p class="dict-label">Strong's Definition / KJV Usage</p><p>foresee, saw before.</p></div>

    </div>

    <div class="dict-footer">
      <a href="javascript:history.back()" class="btn">Back</a>
    </div>

  </div>

<script>
var concPages = {};
function toggleBook(idx) {
  var el = document.getElementById("conc-verses-" + idx);
  var btn = document.getElementById("conc-toggle-" + idx);
  if (!el || !btn) return;
  if (el.style.display === "none") {
    el.style.display = "block";
    var t = btn.innerHTML;
    btn.innerHTML = t.replace("\u25B6", "\u25BC");
  } else {
    el.style.display = "none";
    var t2 = btn.innerHTML;
    btn.innerHTML = t2.replace("\u25BC", "\u25B6");
  }
}
function concPage(bookIdx, delta) {
  if (!concPages[bookIdx]) concPages[bookIdx] = 0;
  var cur = concPages[bookIdx];
  var next = cur + delta;
  var curEl = document.getElementById("conc-page-" + bookIdx + "-" + cur);
  var nextEl = document.getElementById("conc-page-" + bookIdx + "-" + next);
  if (!nextEl) return;
  if (curEl) curEl.style.display = "none";
  nextEl.style.display = "block";
  concPages[bookIdx] = next;
  var total = 0;
  for (var i = 0; i < 200; i++) {
    if (document.getElementById("conc-page-" + bookIdx + "-" + i)) {
      total++;
    } else {
      break;
    }
  }
  var label = document.getElementById("conc-pg-" + bookIdx);
  if (label) label.innerHTML = "Page " + (next + 1) + " of " + total;
}
</script>
</body>
</html>
