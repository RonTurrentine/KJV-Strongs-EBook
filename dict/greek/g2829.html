<div class="conc-section">
  <h2 class="conc-heading">Occurrences in New Testament <span class="conc-total">(2 total)</span></h2>

    <button class="conc-book-toggle" id="conc-toggle-0" onclick="toggleBook(0)">
      &#9654; Matthew <span class="conc-count">(1)</span>
    </button>
    <div class="conc-verses" id="conc-verses-0" style="display:none">

  <div class="conc-book" id="conc-book-1">
    <button class="conc-book-toggle" id="conc-toggle-1" onclick="toggleBook(1)">
      &#9654; Mark <span class="conc-count">(1)</span>
    </button>
    <div class="conc-verses" id="conc-verses-1" style="display:none">
      <a href="../../books/41-Mark/7.html#verse-22" class="conc-link">Mark 7:22 <span class="conc-word">&ldquo;Thefts&rdquo;</span></a>
    </div>
  </div>
</div>

<script>
var concPages = {};
function toggleBook(idx) {
  var el = document.getElementById("conc-verses-" + idx);
  var btn = document.getElementById("conc-toggle-" + idx);
  if (!el || !btn) return;
  if (el.style.display === "none") {
    el.style.display = "block";
    var t = btn.innerHTML;
    btn.innerHTML = t.replace("\u25B6", "\u25BC");
  } else {
    el.style.display = "none";
    var t2 = btn.innerHTML;
    btn.innerHTML = t2.replace("\u25BC", "\u25B6");
  }
}
function concPage(bookIdx, delta) {
  if (!concPages[bookIdx]) concPages[bookIdx] = 0;
  var cur = concPages[bookIdx];
  var next = cur + delta;
  var curEl = document.getElementById("conc-page-" + bookIdx + "-" + cur);
  var nextEl = document.getElementById("conc-page-" + bookIdx + "-" + next);
  if (!nextEl) return;
  if (curEl) curEl.style.display = "none";
  nextEl.style.display = "block";
  concPages[bookIdx] = next;
  var total = 0;
  for (var i = 0; i < 200; i++) {
    if (document.getElementById("conc-page-" + bookIdx + "-" + i)) {
      total++;
    } else {
      break;
    }
  }
  var label = document.getElementById("conc-pg-" + bookIdx);
  if (label) label.innerHTML = "Page " + (next + 1) + " of " + total;
}
</script>
</body>
